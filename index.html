    <!-- Google Fonts Link Start -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    />
    <!-- Google Fonts Link End -->
    <!-- Font Awesome Link Start -->
    <link rel="stylesheet" href="./css/all.min.css" />
    <!-- Font Awesome Link End -->
    <!-- Bootstrap CSS Link Start -->
    <link rel="stylesheet" href="./css/bootstrap.min.css" />

  <body>
    <!-- Navbar Section Start -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./images/logo.png" alt="logo.png" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav m-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Shop</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
        <div class="nav_actions">
          <i class="fa-solid fa-user"></i>
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-regular fa-heart"></i>
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
      </div>
    </nav>
    <!-- Navbar Section End -->

    <!-- Banner Section Start -->
    <section id="banner">
      <div class="container">
        <div class="row justify-content-end align-items-center">
          <div class="col-lg-6">
            <div class="bannerContent">
              <span>New Arrival</span>
              <h1>Discover Our<br />New Collection</h1>
              <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit
                tellus, luctus nec ullamcorper mattis.
              </p>
              <a href="#" class="primaryBtn">BUY NOW</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Banner Section End -->

    <!-- Browse Section Start -->
    <section id="browse">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="browse_title text-center">
              <h2>Browse The Range</h2>
              <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-4">
            <div class="browse_item">
              <div class="browse_img">
                <img src="./images/dining.png" alt="Dining" class="img-fluid" />
              </div>
              <h3>Dining</h3>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="browse_item">
              <div class="browse_img">
                <img src="./images/living.png" alt="Living" class="img-fluid" />
              </div>
              <h3>Living</h3>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="browse_item">
              <div class="browse_img">
                <img
                  src="./images/bedroom.png"
                  alt="Bedroom"
                  class="img-fluid"
                />
              </div>
              <h3>Bedroom</h3>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Browse Section End -->

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/script.js"></script>

</html>
